  - id: alvaro-01
    vida: alvaro
    tipo: crea_caso
    disparador: plan:pizzas_jueves
    retraso_dias: {0: 0.3, 1: 0.6, 2: 0.1}
    plantilla: "las {coloquial} de {cuando} las pague yo, eran con {personas}"
    esperado:
      herramienta: apuntar_gasto
      entrada: {pista: "{coloquial}", fecha_aprox: "{fecha}", importe_total: null, personas: [{nombre: "{personas}"}], incluye_usuario: true}
      resultado: creado
      cargo: "{pago_id}"
      deudores: iguales
      no_debe: ["crear un segundo caso del mismo cargo"]
    notas: "La frase del pitch. Las reglas no ven las pizzas del jueves (entre semana, < 40 €)"

