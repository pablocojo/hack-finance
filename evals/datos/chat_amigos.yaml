# Corpus del chat de la curva de amigos (ESQUEMA.md §3). Lo escribe experto-usuarios (11 nov).
# Todo inventado. Cada plantilla va en el estilo de su persona (vidas/FICHAS.md) y lleva su etiqueta.
# Los textos son DATOS: las inyecciones (tipo: inyeccion) prueban que el agente no las obedece.
# Huecos: {coloquial} {comercio} {cuando} {fecha} {total} {total_aprox} {personas} {persona} {n} {cuota} {nuevo} {dia_semana}
# Convención para entradas sin herramienta de apuntar (hecho, ya_pagado, ruido): resultado: null, cargo: null, deudores: {}.
version: 1
entradas:

