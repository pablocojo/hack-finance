# demo-pablo (11 nov, encargo de Pablo): la demo sencilla de /app, día a día, con los gastos entre amigos.
# Datos sintéticos: Pablo es estudiante universitario en Madrid; los alias de Bizum de sus amigos son inventados.
# Historial previo (21/9 -> 1/11, 6 semanas, para que `perfilar` tenga >= 28 días): súper, cafetería de la facultad,
# copistería, farmacia, la recarga del abono joven, Spotify, la paga de su madre, dos sábados de pizzas en Mamma Rosa
# con Rodrigo, Irene y Nacho (le devolvieron los tres por Bizum) y unas hamburguesas con Sergio (también le devolvió).
# Activación: domingo 1/11. Demo: del lunes 2/11 al domingo 15/11, con solo DOS notificaciones de Meisam:
#   vie  6/11  cena en Taberna El Búho, 34,60 € (con Sergio, que no le manda nada). Un viernes es señal débil: el
#              domingo 8/11 se abre un caso en SILENCIO (`pago_individual`, aviso `silencioso`). Pablo lo apunta él
#              (chat: «la cena del viernes en El Búho la pagué yo, era con Sergio», o el botón del movimiento).
#   sáb  7/11  Kinepolis Ciudad de la Imagen, 32,70 € = 3 entradas de sábado (10,90 €) o 2 entradas con dos palomitas
#              pequeñas (precios reales de la caché versionada). Nadie le manda nada.
#   -> lun 9/11  CINE: pregunta de un toque «32,70 € en Kinepolis...: parecen 3 entradas. ¿Fuiste con alguien?»
#              (juicio de la IA, p = 0,8, grabado en la caché versionada): NOTIFICACIÓN.
#   dom  8/11  pizzas en Pizzeria Mamma Rosa, 52,00 € para cuatro; Rodrigo e Irene le mandan 13 € esa noche.
#   -> mar 10/11 PIZZAS: falta Nacho G (13 €), el de siempre en Mamma Rosa: NOTIFICACIÓN con «Pedir Bizum».
#              Las dos notificaciones van en días seguidos: así la segunda no cae al Resumen si la primera se ignora
#              (48 h sin respuesta cuentan como molestia).
#   Con `amigos_pagan_tras_solicitud_dias: 1`, si Pablo pide el Bizum con el botón el 10/11, el 11/11 entra el Bizum de
#   Nacho por ese importe (lo crea el código, no la IA) y el caso queda «Saldado» por el cierre de siempre.
#   El resto (cafetería, súper, farmacia, copistería, Spotify, ropa) no avisa nada.
# Las fechas salen de la espera propia: los amigos de Pablo devuelven en 0-2 días (p75 = 1 -> espera de 2 días).
# Los Bizums de las pizzas caen en la ventana del cine, pero son las cuotas de OTRO pago con un reparto válido: no
# callan la pregunta del cine (regla 4 de `pago_individual`, 11 nov).
